name: Publish

# Publishing is deliberately not tied to pushes on master. It runs when a
# GitHub Release is published, or manually via workflow_dispatch -- which also
# offers TestPyPI, the sane place to rehearse a first upload, since a real PyPI
# filename can never be reused even after deletion.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Index to upload to"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest

    env:
      JAX_PLATFORM_NAME: cpu
      JAX_ENABLE_X64: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[jax,test]"

      # The artifacts are what gets published, so the suite runs here rather
      # than relying on CI having passed on some earlier commit. [jax,test]
      # above matters: without the jax extra the QOT convergence tests skip.
      - name: Run tests
        run: python -m pytest -q

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

      - name: Check artifact metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*

      # A tag that disagrees with the packaged version yields a release whose
      # name does not match what users install; fail loudly instead.
      - name: Verify tag matches package version
        if: github.event_name == 'release'
        run: |
          python -m pip install -e . --no-deps
          pkg="$(python -c 'import importlib.metadata as m; print(m.version("sdplab"))')"
          tag="${GITHUB_REF_NAME#v}"
          echo "package=$pkg tag=$tag"
          test "$pkg" = "$tag"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/sdplab
    permissions:
      id-token: write        # OIDC for Trusted Publishing; no API token stored

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sdplab
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
