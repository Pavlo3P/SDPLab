name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    env:
      JAX_PLATFORM_NAME: cpu
      JAX_ENABLE_X64: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy "jax[cpu]" optax cvxpy spacecore

      - name: Run tests
        run: python -m pytest -q
