[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdplab"
version = "0.0.1"
description = "Tools for constructing and solving regularized semidefinite programming problems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "cvxpy",
    "spacecore>=0.4.2,<0.5",
]

[project.optional-dependencies]
jax = [
    "spacecore[jax]",
    "jax>=0.9.1",
    "optax>=0.2",
]
test = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["sdplab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
