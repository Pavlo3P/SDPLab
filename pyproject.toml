[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdplab"
version = "0.1.0"
description = "Tools for constructing and solving regularized semidefinite programming problems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "cvxpy",
    "jax[cpu]",
    "optax",
    "spacecore>=0.2.0,<0.3",
]

[project.optional-dependencies]
quantum = [
    "qiskit",
    "qiskit-aer",
]
test = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["sdplab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
